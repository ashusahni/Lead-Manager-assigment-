services:
  - type: web
    name: lead-manager-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build && npm run seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
